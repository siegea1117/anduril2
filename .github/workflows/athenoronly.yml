name: build-sp36-only

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y avr-libc gcc-avr binutils-avr unzip wget

      - name: Install Atmel Device Packs
        run: |
          make dfp

      - name: Build SP36 T1616
        run: |
          make sofirn-sp36-t1616

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: sp36-t1616-firmware
          path: hex/anduril.sofirn-sp36-t1616.hex
